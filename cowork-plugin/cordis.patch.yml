# Additive local bundle: no provider, credentials, default selection, or existing preset writes.
# Install into the dedicated Cowork profile. Never select this as a replacement for desktop.
- insert:
    - id: preset-cowork-phone
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: cowork-phone
        name: Cowork
        description: Restricted native-phone assistant; no shell, code, packages, subagents or MCP.
        order: 20
        plugins:
          - id: cowork-policy-tools-summary
            name: '@local/dsh-cowork-phone'

    # Notification triggers: Continuo's batches reach the signed loopback ingress in src/notify.mjs (127.0.0.1:3082).
    # What Jev passes becomes an unattended turn of the app's standing Cowork session (one per app, never archived).
    # src/notify.mjs no longer dispatches through dsh-webhook; the mount stays so installed profiles keep loading
    # unchanged. Conflicts with any other overlay that also mounts @deepseek-ai/dsh-webhook.
    - id: cowork-webhook-runtime
      name: '@deepseek-ai/dsh-webhook'

    - id: cowork-notify
      name: './src/notify.mjs'
