# Additive local bundle: no provider, credentials, default selection, or existing preset writes.
# Install into the dedicated Cowork profile. Never select this as a replacement for desktop.
- insert:
    - id: preset-cowork-phone
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: cowork-phone
        name: Cowork
        description: Restricted native-phone assistant; no shell, code, packages, subagents or MCP.
        order: 20
        plugins:
          - id: cowork-policy-tools-summary
            name: '@local/dsh-cowork-phone'

    # Notification triggers: Continuo's notification rules reach DSH's webhook runtime through the signed loopback
    # ingress in src/notify.mjs (127.0.0.1:3082). Each coalesced trigger becomes one unattended Cowork session,
    # archived when its turn finishes. Conflicts with any other overlay that also mounts @deepseek-ai/dsh-webhook.
    - id: cowork-webhook-runtime
      name: '@deepseek-ai/dsh-webhook'

    - id: cowork-notify
      name: './src/notify.mjs'
