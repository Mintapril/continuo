# Additive local bundle: no provider, credentials, default selection, or existing preset writes.
# Install into the dedicated Cowork profile. Never select this as a replacement for desktop.
- insert:
    - id: preset-cowork-phone
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: cowork-phone
        name: Cowork
        description: Restricted native-phone assistant; no shell, code, packages, subagents or MCP.
        order: 20
        plugins:
          # Since DSH 0.2.1 each preset declares these itself (0.2.0's schedule bundle mounted them for every session):
          # the clock reading each turn starts with, and the automation tools (schedule_*), registered in this
          # preset's scope over the host schedule service; the Cowork guard still decides who may write.
          - id: cowork-time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: cowork-tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: cowork-policy-tools-summary
            name: '@local/dsh-cowork-phone'
          # Cowork's own context compaction (src/context.mjs), in this preset's realm the way DSH's standard preset
          # mounts compaction-basic: old screens are dropped without a model call once the history passes the threshold
          # (8% of the window: 80K tokens on the 1M routes), and only then the oldest part is summarized, keeping the
          # newest 32K tokens as they are. No context tool or nudge reaches the model.
          - id: cowork-compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: cowork-context-pruner
                name: '@local/dsh-cowork-phone/context-pruner'
              - id: cowork-context
                name: '@local/dsh-cowork-phone/context'
                config:
                  thresholdRatio: 0.08
                  retainTokens: 32000
                  maxTokens: 16000

    # Notification triggers: Continuo's batches reach the signed loopback ingress in src/notify.mjs (127.0.0.1:3082).
    # What Jev passes becomes an unattended turn of the app's standing Cowork session (one per app, never archived).
    - id: cowork-notify
      name: './src/notify.mjs'

    # The model unattended runs use (patrols, notification triggers), set in Continuo over DSH's authenticated RPC
    # (namespace coworkUnattended); the preset applies it per request without touching DSH's default model.
    - id: cowork-unattended
      name: './src/unattended.mjs'
